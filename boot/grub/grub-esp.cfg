# NwOS installed-system ESP: standalone GRUB x86_64-efi.
# Keep this configuration small: the installer uses a fixed 7 MiB FAT16 ESP.
set timeout=3
set default=0

insmod efi_gop
insmod video
insmod part_gpt
insmod part_msdos
insmod fat
insmod search
insmod search_fs_file
insmod multiboot2
insmod test

set gfxpayload=keep
search --no-floppy --file --set=root /boot/kernel.elf

menuentry "NwOS" {
    multiboot2 /boot/kernel.elf
    module2 /boot/kernel.elf nwos-kernel-image

    if [ -f /boot/nwos/world_english_bible.txt ]; then
        module2 /boot/nwos/world_english_bible.txt nwos-bible-passages
    fi

    boot
}

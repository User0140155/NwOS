# NwOS live ISO: GRUB 2, Multiboot2, BIOS + UEFI x86-64.
set timeout=5
set default=0

insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search
insmod search_fs_file
insmod multiboot2
insmod test

set gfxmode=auto
terminal_output gfxterm
set gfxpayload=keep

search --no-floppy --file --set=root /boot/kernel.elf

menuentry "NwOS (Live / Installer)" {
    multiboot2 /boot/kernel.elf
    module2 /boot/kernel.elf nwos-kernel-image
    module2 /boot/nwos/esp.img nwos-esp-image

    if [ -f /boot/nwos/world_english_bible.txt ]; then
        module2 /boot/nwos/world_english_bible.txt nwos-bible-passages
    fi

    boot
}

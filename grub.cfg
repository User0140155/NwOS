# NwOS Ventoy GRUB2 fallback.
# Ventoy provides the ISO contents through (loop).
set root=(loop)
insmod all_video
insmod gfxterm
insmod iso9660
insmod multiboot2
insmod test

set gfxmode=auto
terminal_output gfxterm
set gfxpayload=keep

menuentry "NwOS (Ventoy fallback)" {
    multiboot2 /boot/kernel.elf
    module2 /boot/kernel.elf nwos-kernel-image
    module2 /boot/nwos/esp.img nwos-esp-image

    if [ -f /boot/nwos/world_english_bible.txt ]; then
        module2 /boot/nwos/world_english_bible.txt nwos-bible-passages
    fi

    boot
}

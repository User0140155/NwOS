<body>
    <header class="site-header">
        <div class="header-left">
            <a class="site-brand" href="index.html">
                <img src="img/LogoNwOS.png" alt="NwOS logo" width="28" height="28">

            <nav class="site-nav">

    <section class="section">
        <h2 class="section-title">Gallery</h2>

                </figure>
                <figure class="gallery-slide" data-title="nwfetch" data-desc="System info tool of NwOS.">

                </figure>
                <figure class="gallery-slide" data-title="runhi.nwo" data-desc="Compiled .nwo program running on the OS.">
                    <img src="img/assets/runhi.nwo.png" alt="runhi.nwo" loading="lazy">

            <button class="car-arrow car-next" aria-label="Next">&#8594;</button>
        </div>

        <div class="car-caption">
            <span class="car-counter">1 / 3</span>
            <h3 class="car-title">nanoedit</h3>
            <p class="car-desc">Text editor running inside NwOS.</p>
